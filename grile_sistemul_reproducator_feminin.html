let state=loadState();
let filterUnanswered=false;
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return{}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function eqSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function render(){
  const root=document.getElementById('quiz');
  const data=filterUnanswered?QUESTIONS.filter(q=>!state[q.id]?.submitted):QUESTIONS;
  root.innerHTML=data.map(q=>cardHtml(q)).join('') || '<div class="q-card"><strong>Ai completat toate grilele.</strong></div>';
  updateProgress();
}
function cardHtml(q){
  const s=state[q.id]||{selected:[],submitted:false};
  const selected=s.selected||[];
  const submitted=!!s.submitted;
  const isOk=submitted&&eqSet(selected,q.correct);
  const opts=Object.entries(q.options).map(([letter,text])=>{
    let cls='option';
    if(selected.includes(letter))cls+=' selected';
    if(submitted){
      if(q.correct.includes(letter)&&selected.includes(letter))cls+=' correct';
      else if(!q.correct.includes(letter)&&selected.includes(letter))cls+=' wrong';
      else if(q.correct.includes(letter)&&!selected.includes(letter))cls+=' missed';
    }
    return `<label class="${cls}" data-q="${q.id}" data-letter="${letter}"><input type="checkbox" ${selected.includes(letter)?'checked':''} ${submitted?'disabled':''}><span class="letter">${letter}</span><span>${text}</span></label>`;
  }).join('');
  return `<article class="q-card ${submitted?'submitted':''}" id="q${q.id}" data-submitted="${submitted}">
    <div class="q-head"><div class="q-num">${q.id}</div><div><h3 class="q-title">${q.text}</h3><div class="q-topic">${q.topic} · original ${q.original}</div></div></div>
    <div class="options">${opts}</div>
    <div class="q-actions">
      <button class="btn" onclick="submitQuestion(${q.id})" ${submitted?'disabled':''}>Verifică</button>
      <button class="btn secondary" onclick="clearQuestion(${q.id})">Șterge</button>
      ${submitted?`<span class="result ${isOk?'ok':'bad'}">${isOk?'Corect':'Mai verifică'}</span>`:''}
    </div>
    <div class="answer-key">Barem: <strong>${q.correct.join(', ')}</strong></div>
  </article>`;
}
document.addEventListener('change',e=>{
  const opt=e.target.closest('.option');
  if(!opt)return;
  const qId=opt.dataset.q;
  const letter=opt.dataset.letter;
  const s=state[qId]||{selected:[],submitted:false};
  if(s.submitted)return;
  s.selected=e.target.checked?[...new Set([...(s.selected||[]),letter])]:(s.selected||[]).filter(x=>x!==letter);
  state[qId]=s;
  saveState();
  render();
});
function submitQuestion(id){
  const s=state[id]||{selected:[],submitted:false};
  if(!s.selected.length)return;
  s.submitted=true;
  state[id]=s;
  saveState();
  render();
  document.getElementById('q'+id)?.scrollIntoView({behavior:'smooth',block:'center'});
}
function clearQuestion(id){delete state[id];saveState();render()}
function resetQuiz(){if(confirm('Resetezi progresul pentru grilele de reproducător feminin?')){state={};saveState();render()}}
function showOnlyUnanswered(){filterUnanswered=true;render()}
function showAll(){filterUnanswered=false;render()}
function updateProgress(){
  const submitted=QUESTIONS.filter(q=>state[q.id]?.submitted);
  const correct=submitted.filter(q=>eqSet(state[q.id].selected||[],q.correct)).length;
  document.getElementById('progressText').textContent=`${submitted.length} / ${QUESTIONS.length} completate`;
  document.getElementById('scoreText').textContent=`${correct} corecte`;
  document.getElementById('progressBar').style.width=`${Math.round(submitted.length/QUESTIONS.length*100)}%`;
  const final=document.getElementById('final');
  if(submitted.length===QUESTIONS.length){
    final.style.display='block';
    final.innerHTML=`<h2>Rezultat final: ${correct}/${QUESTIONS.length}</h2><p>${correct} grile corecte complet, ${QUESTIONS.length-correct} de revăzut.</p>`;
  }else final.style.display='none';
}
render();
</script>
